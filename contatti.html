<!doctype html>
<html lang="it">
	<head>
  <title>All'Antica Trattoria | Contatti</title>
  <div id="head-content"></div>
</head>
<body>
<div class="topline"></div>
<div id="header"></div>

<main>
  <section class="pagehero">
    <div class="eyebrow">Vieni a trovarci</div>
    <h1>Contatti</h1>
    <p>Saremo felici di accoglierti e condividere con te il piacere della buona tavola.</p>
  </section>
  <section class="section">
    <div class="container contact-grid">
      <div class="contact-card">
        <div class="smallcaps">All'Antica Trattoria</div>
        <h2 style="font-size:34px">Ti aspettiamo</h2>
        <div class="contact-line"><b>☎</b><span><strong>Telefono</strong><br>
        <a href="tel:+393773937610">377 393 7610</a></span></div>
        <div class="contact-line"><b>✉</b><span><strong>Email</strong><br>
        <a href="mailto:info@allanticatrattoria.it">info@allanticatrattoria.it</a></span></div>
        <div class="contact-line"><b>⌖</b><span><strong>Indirizzo</strong><br>
          SP119, 82030 Limatola BN</span></div>
      <a class="btn" target="_blank" rel="noopener" href="https://maps.app.goo.gl/f4HNykDEC1SBibpn6">Apri su Google Maps</a></div>
	<iframe class="map" title="Mappa All'Antica Trattoria" loading="lazy" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3004.4109019850416!2d14.3824622!3d41.1473844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x133a51375349b4b5%3A0x553381fe0cd0919d!2sAll'antica%20Trattoria!5e0!3m2!1sit!2sit!4v1793443880858!5m2!1sit!2sit"></iframe>
    </div>
  </section>
</main>
<div id="footer"></div>
<script>
		
		fetch('/head.html')
  .then(res => res.text())
  .then(data => {
    const temp = document.createElement('div');
    temp.innerHTML = data;

    temp.querySelectorAll('link[rel="icon"]').forEach(link => {
      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = link.type;
      favicon.href = link.href;
      document.head.appendChild(favicon);
    });

    document.getElementById('head-content').innerHTML = data;
  });
		
fetch('header.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('header').innerHTML = data;
  });

fetch('footer.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('footer').innerHTML = data;
  });
</script>
</body>
</html>
